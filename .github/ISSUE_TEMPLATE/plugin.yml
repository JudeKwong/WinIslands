name: 插件展示 / Plugin showcase
description: 提交你制作的 WinIslands 插件，或申请收录到社区列表
title: "[Plugin] "
labels: ["plugin"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先阅读 `docs/PLUGIN_TEMPLATE.md`，并用 `tools/validate-plugin.ps1` 自检。
  - type: input
    id: plugin-name
    attributes:
      label: 插件名称
      placeholder: 例如：内存占用
    validations:
      required: true
  - type: input
    id: plugin-id
    attributes:
      label: 插件 ID
      placeholder: 例如：com.example.memory
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 功能说明
      description: 插件向灵动岛提供哪些组件？多久刷新一次？
    validations:
      required: true
  - type: checkboxes
    id: permissions
    attributes:
      label: 声明的权限
      options:
        - label: network
        - label: filesystem
        - label: processes
        - label: 无额外权限
  - type: input
    id: download
    attributes:
      label: 下载地址或仓库链接
      placeholder: https://
    validations:
      required: true
  - type: input
    id: tested-version
    attributes:
      label: 测试过的 WinIslands 版本
      placeholder: 例如：3.1.9
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 自检
      options:
        - label: 已通过 tools/validate-plugin.ps1
          required: true
        - label: sha256 与入口文件一致
          required: true
        - label: 不包含密钥或个人数据
          required: true
