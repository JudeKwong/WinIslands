version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      windows-dotnet:
        patterns:
          - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: nuget
    directory: /macos
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      macos-dotnet:
        patterns:
          - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: pip
    directory: /build
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      build-python:
        patterns:
          - '*'
