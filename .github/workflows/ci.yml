name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  policy:
    name: PR policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate pull request
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          title="$(printf '%s' "$PR_TITLE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ ${#title} -lt 4 ] || [ ${#title} -gt 120 ]; then
            echo "::error::PR title must be 4-120 characters."
            exit 1
          fi

          git diff --name-only "origin/${BASE_REF}...HEAD" | tee changed-files.txt
          if grep -Eq '(^|/)(\.env($|\.)|id_rsa|id_ed25519|.*\.(pfx|p12|pem|key)$)' changed-files.txt; then
            echo "::error::Secrets or signing material must never be committed."
            exit 1
          fi
          if grep -Eq '(^|/)(bin|obj|TestResults|artifacts|releases)/' changed-files.txt; then
            echo "::error::Generated build/release output must not be committed."
            exit 1
          fi

          git diff --unified=0 "origin/${BASE_REF}...HEAD" > pr.patch
          if grep -E '^\+.*(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' pr.patch; then
            echo "::error::A possible private key or access token was added."
            exit 1
          fi

  windows:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            tests/**/*.csproj
      - name: Restore
        run: dotnet restore tests/WinIslands.Tests/WinIslands.Tests.csproj
      - name: Build
        run: dotnet build tests/WinIslands.Tests/WinIslands.Tests.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/WinIslands.Tests/WinIslands.Tests.csproj -c Release --no-build --logger "trx;LogFileName=windows-tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-results
          path: tests/WinIslands.Tests/TestResults/*.trx
          if-no-files-found: ignore

  macos:
    name: macOS build and core tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            macos/src/**/*.csproj
            macos/tests/**/*.csproj
      - name: Restore
        run: dotnet restore macos/WinIslands.sln
      - name: Build app
        run: dotnet build macos/src/WinIslands.Mac/WinIslands.Mac.csproj -c Release --no-restore
      - name: Test core
        run: dotnet test macos/tests/WinIslands.Core.Tests/WinIslands.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=macos-tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-test-results
          path: macos/tests/WinIslands.Core.Tests/TestResults/*.trx
          if-no-files-found: ignore

  pr-gate:
    name: PR gate
    if: always() && github.event_name == 'pull_request'
    needs: [policy, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate job to pass
        shell: bash
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          set -euo pipefail
          printf 'policy=%s windows=%s macos=%s\n' "$POLICY_RESULT" "$WINDOWS_RESULT" "$MACOS_RESULT"
          for result in "$POLICY_RESULT" "$WINDOWS_RESULT" "$MACOS_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required PR gate job did not succeed."
              exit 1
            fi
          done
