var LYRICS = [{"chars":"孩童只望望欢乐","start":0,"duration":3},{"chars":"大人只知道期望","start":3,"duration":3},{"chars":"为何都不大汉得","start":6,"duration":3},{"chars":"努力体康对方","start":9,"duration":3},{"chars":"陪我讲出我们最后何以生玐","start":12,"duration":3},{"chars":"明月光 为何又照地堂","start":15,"duration":3},{"chars":"Shall we talk Shall we talk","start":18,"duration":3}];

// ===== Springs (non-linear, silky) =====
// Slow soft spring for island expand/collapse
function silkySpring(t) {
  var damping=18, stiffness=120, mass=1.5;
  var omega0 = Math.sqrt(stiffness / mass);
  var zeta = damping / (2 * Math.sqrt(stiffness * mass));
  var omegaD = omega0 * Math.sqrt(1 - zeta * zeta);
  var ts = t * 0.6;
  return 1 - Math.exp(-zeta * omega0 * ts) * (Math.cos(omegaD * ts) + (zeta * omega0 / omegaD) * Math.sin(omegaD * ts));
}
// Soft spring for notifications
function notifSpring(t) {
  var damping=20, stiffness=80, mass=1.5;
  var omega0 = Math.sqrt(stiffness / mass);
  var zeta = damping / (2 * Math.sqrt(stiffness * mass));
  var omegaD = omega0 * Math.sqrt(1 - zeta * zeta);
  var ts = t * 0.5;
  return 1 - Math.exp(-zeta * omega0 * ts) * (Math.cos(omegaD * ts) + (zeta * omega0 / omegaD) * Math.sin(omegaD * ts));
}
// Original app springs for reference
function springEase(t) {
  var damping=12, stiffness=200, mass=1;
  var omega0 = Math.sqrt(stiffness / mass);
  var zeta = damping / (2 * Math.sqrt(stiffness * mass));
  var omegaD = omega0 * Math.sqrt(1 - zeta * zeta);
  var ts = t * 1.7;
  return 1 - Math.exp(-zeta * omega0 * ts) * (Math.cos(omegaD * ts) + (zeta * omega0 / omegaD) * Math.sin(omegaD * ts));
}
function smoothStep(t) { return t * t * (3 - 2 * t); }
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3) / 2; }

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ===== Song position mapping =====
function getSongPos(t) {
  if (t < 2500) return 0;
  if (t < 11500) return (t - 2500) / 1000;
  if (t < 15500) return 9;
  if (t < 24500) return 9 + (t - 15500) / 1000;
  if (t < 27500) return 18;
  // 27.5-32.5s: continue with last lyric line
  return 18 + (t - 27500) / 1000;
}

// ===== Get current lyric line and karaoke progress =====
function getLyricProgress(songPos) {
  var lineIdx = -1, progress = 0;
  for (var i = LYRICS.length - 1; i >= 0; i--) {
    if (songPos >= LYRICS[i].start) {
      lineIdx = i;
      progress = clamp((songPos - LYRICS[i].start) / LYRICS[i].duration, 0, 1);
      break;
    }
  }
  return { lineIdx: lineIdx, progress: progress };
}

// ===== Per-character karaoke (smoothstep, first char starts unlit) =====
function drawKaraokeLine(text, x, y, fontSize, progress, opacity) {
  ctx.font = "600 " + fontSize + "px -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif";
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";
  var litCount = Math.floor(progress * text.length);
  var blendFrac = progress * text.length - litCount;
  var blendSmooth = smoothStep(blendFrac);
  var charX = x;
  for (var i = 0; i < text.length; i++) {
    var cw = ctx.measureText(text[i]).width;
    var r, g, b;
    if (i < litCount) { r=255; g=255; b=255; }
    else if (i === litCount && blendFrac > 0.001) {
      var val = Math.round(lerp(90, 255, blendSmooth));
      r=val; g=val; b=val;
    } else { r=90; g=90; b=90; }
    ctx.fillStyle = "rgba(" + r + "," + g + "," + b + "," + opacity + ")";
    ctx.fillText(text[i], charX, y);
    charX += cw;
  }
  return charX - x;
}
// ===== Waveform =====
function drawWaveform(x, y, w, h, t, opacity) {
  var barCount = 5, barW = 2.5, gap = 2.5;
  for (var i = 0; i < barCount; i++) {
    var phase = t * 0.005 + i * 0.6;
    var amp = Math.abs(Math.sin(phase)) * 0.4 + Math.abs(Math.sin(phase * 1.7 + 0.5)) * 0.35 + 0.15;
    amp = clamp(amp, 0.12, 1);
    var barH = amp * h;
    var bx = x + i * (barW + gap);
    var by = y + (h - barH) / 2;
    ctx.fillStyle = "rgba(108, 92, 231, " + opacity + ")";
    roundRect(bx, by, barW, barH, 1.25);
    ctx.fill();
  }
}

// ===== Icons (smaller) =====
function drawPlayIcon(x, y, s, o) {
  ctx.fillStyle = "rgba(255,255,255," + o + ")";
  ctx.beginPath();
  ctx.moveTo(x + s * 0.2, y);
  ctx.lineTo(x + s * 0.85, y + s * 0.5);
  ctx.lineTo(x + s * 0.2, y + s);
  ctx.closePath();
  ctx.fill();
}
function drawPauseIcon(x, y, s, o) {
  ctx.fillStyle = "rgba(255,255,255," + o + ")";
  var bw = s * 0.28;
  roundRect(x, y, bw, s, 2); ctx.fill();
  roundRect(x + bw + s * 0.16, y, bw, s, 2); ctx.fill();
}
function drawNextIcon(x, y, s, o) {
  ctx.fillStyle = "rgba(255,255,255," + o + ")";
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + s * 0.6, y + s * 0.5);
  ctx.lineTo(x, y + s);
  ctx.closePath();
  ctx.fill();
  ctx.fillRect(x + s * 0.6, y, 2, s);
}

// ===== Draw island =====
function drawIsland(expandProgress, songPos, t, isPlaying, islandAlpha) {
  if (islandAlpha === undefined) islandAlpha = 1;
  var compactW = 520, expandedW = 640;
  var compactH = 54, expandedH = 390;
  var w = lerp(compactW, expandedW, expandProgress);
  var h = lerp(compactH, expandedH, expandProgress);
  var cx = 960;
  var x = cx - w / 2;
  var y = 46;
  var r = lerp(27, 27, expandProgress);
  var padX = lerp(14, 24, expandProgress);
  var coverSize = lerp(34, 70, expandProgress);
  var coverR = lerp(10, 18, expandProgress);

  ctx.globalAlpha = islandAlpha;

  // Background with shadow
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.45)";
  ctx.shadowBlur = 30;
  ctx.shadowOffsetY = 8;
  roundRect(x, y, w, h, r);
  ctx.fillStyle = "#101018";
  ctx.fill();
  ctx.restore();

  // Border
  roundRect(x, y, w, h, r);
  ctx.strokeStyle = "rgba(255,255,255,0.12)";
  ctx.lineWidth = 1;
  ctx.stroke();

  // Clip
  ctx.save();
  roundRect(x, y, w, h, r);
  ctx.clip();

  // Album cover
  var coverX = x + padX;
  var compactCoverY = y + (compactH - 34) / 2;
  var expandedCoverY = y + 22;
  var coverY = lerp(compactCoverY, expandedCoverY, expandProgress);
  if (coverImg.complete && coverImg.naturalWidth > 0) {
    ctx.save();
    roundRect(coverX, coverY, coverSize, coverSize, coverR);
    ctx.clip();
    ctx.drawImage(coverImg, coverX, coverY, coverSize, coverSize);
    ctx.restore();
  } else {
    roundRect(coverX, coverY, coverSize, coverSize, coverR);
    ctx.fillStyle = "#2a2a3a";
    ctx.fill();
  }

  var lp = getLyricProgress(songPos);
  var compactOpacity = clamp(1 - smoothStep(expandProgress), 0, 1);
  var expandedOpacity = clamp(smoothStep(expandProgress), 0, 1);

  // === Compact content ===
  if (compactOpacity > 0.01) {
    ctx.globalAlpha = compactOpacity * islandAlpha;
    var titleX = coverX + coverSize + 14;
    var titleY = y + h / 2;

    if (lp.lineIdx >= 0) {
      drawKaraokeLine(LYRICS[lp.lineIdx].chars, titleX, titleY, 14, lp.progress, 1);
    } else {
      ctx.font = "600 13px -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif";
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.textBaseline = "middle";
      ctx.textAlign = "left";
      ctx.fillText(SONG.title, titleX, titleY);
    }

    // Controls: play/pause + next only (smaller, Apple-style)
    var rightX = x + w - padX;
    var cs = 11;
    var ctrlY = y + (h - cs) / 2;
    drawNextIcon(rightX - cs, ctrlY, cs, 0.55);
    rightX -= cs + 7;
    if (isPlaying) { drawPauseIcon(rightX - cs, ctrlY, cs, 0.85); }
    else { drawPlayIcon(rightX - cs, ctrlY, cs, 0.85); }
    ctx.globalAlpha = islandAlpha;
  }

  // === Expanded content ===
  if (expandedOpacity > 0.01) {
    ctx.globalAlpha = expandedOpacity * islandAlpha;

    var eTitleX = coverX + coverSize + 16;
    ctx.font = "700 16px -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.textBaseline = "top";
    ctx.textAlign = "left";
    ctx.fillText(SONG.title, eTitleX, y + 16);
    ctx.font = "400 13px -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.fillText(SONG.artist, eTitleX, y + 38);

    // Lyrics list
    var lyricsTop = y + coverSize + 34;
    var lyricsBottom = y + h - 60;
    var lyricsH = lyricsBottom - lyricsTop;
    var lineH = 30;
    var activeY = lyricsTop + lyricsH / 2;

    for (var i = Math.max(0, lp.lineIdx - 3); i <= Math.min(LYRICS.length - 1, lp.lineIdx + 3); i++) {
      var lineY = activeY + (i - lp.lineIdx) * lineH;
      if (lineY < lyricsTop - 5 || lineY > lyricsBottom + 5) continue;
      if (i === lp.lineIdx) {
        drawKaraokeLine(LYRICS[i].chars, x + padX, lineY, 15, lp.progress, 1);
      } else {
        var dist = Math.abs(i - lp.lineIdx);
        var lo = 0.4 / dist;
        ctx.font = "500 14px -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif";
        ctx.fillStyle = "rgba(255,255,255," + lo + ")";
        ctx.textBaseline = "middle";
        ctx.textAlign = "left";
        ctx.fillText(LYRICS[i].chars, x + padX, lineY);
      }
    }

    // Progress bar
    var pbY = y + h - 38;
    var pbX = x + padX;
    var pbW = w - padX * 2;
    var pv = clamp(songPos / 21, 0, 1);
    roundRect(pbX, pbY, pbW, 4, 2);
    ctx.fillStyle = "rgba(255,255,255,0.1)";
    ctx.fill();
    roundRect(pbX, pbY, pbW * pv, 4, 2);
    ctx.fillStyle = "#6C5CE7";
    ctx.fill();

    ctx.font = "500 11px -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.textBaseline = "top";
    var mm = Math.floor(songPos / 60);
    var ss = Math.floor(songPos % 60);
    ctx.textAlign = "left";
    ctx.fillText(mm + ":" + (ss < 10 ? "0" + ss : ss), pbX, pbY + 8);
    ctx.textAlign = "right";
    ctx.fillText("0:21", pbX + pbW, pbY + 8);

    // Controls: play/pause + next (smaller, centered, Apple-style)
    var cs2 = 15;
    var totalCtrlW = cs2 * 2 + 10;
    var ctrlStart = cx - totalCtrlW / 2;
    var ctrlY2 = pbY + 20;
    if (isPlaying) { drawPauseIcon(ctrlStart, ctrlY2, cs2, 0.85); }
    else { drawPlayIcon(ctrlStart, ctrlY2, cs2, 0.85); }
    drawNextIcon(ctrlStart + cs2 + 10, ctrlY2, cs2, 0.55);

    ctx.globalAlpha = islandAlpha;
  }

  ctx.restore();
  ctx.globalAlpha = 1;
}

// ===== Notification (top-right, spring slide-in) =====
function drawNotification(text, subtext, progress, t) {
  var w = 320, h = 68, margin = 24;
  var targetX = 1920 - w - margin;
  var startX = 1920 + 30;
  var x = lerp(startX, targetX, progress);
  var y = 46;
  var r = 18;

  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.4)";
  ctx.shadowBlur = 25;
  ctx.shadowOffsetY = 6;
  roundRect(x, y, w, h, r);
  ctx.fillStyle = "#1c1c28";
  ctx.fill();
  ctx.restore();
  roundRect(x, y, w, h, r);
  ctx.strokeStyle = "rgba(255,255,255,0.1)";
  ctx.lineWidth = 1;
  ctx.stroke();

  var iconX = x + 14, iconY = y + 14, iconSize = 40;
  roundRect(iconX, iconY, iconSize, iconSize, 12);
  ctx.fillStyle = "#6C5CE7";
  ctx.fill();

  ctx.textBaseline = "middle";
  ctx.textAlign = "left";
  ctx.font = "600 14px -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.95)";
  ctx.fillText(text, iconX + iconSize + 10, y + 24);
  ctx.font = "400 12px -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  ctx.fillText(subtext, iconX + iconSize + 10, y + 46);
}

// ===== Title screen =====
function drawTitleScreen(p) {
  var opacity;
  if (p < 0.15) { opacity = easeOutCubic(p / 0.15); }
  else if (p > 0.8) { opacity = 1 - easeInOutCubic((p - 0.8) / 0.2); }
  else { opacity = 1; }
  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "800 72px -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.98)";
  ctx.fillText("WinIslands", 960, 500);
  ctx.font = "400 22px -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.45)";
  ctx.fillText("Windows 11 / 10 灵动岛组件", 960, 560);
  ctx.restore();
}

// ===== CTA =====
function drawCTA(p) {
  var opacity = easeOutCubic(clamp(p / 0.15, 0, 1));
  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "800 64px -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.98)";
  ctx.fillText("WinIslands", 960, 480);
  ctx.font = "400 20px -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif";
  ctx.fillStyle = "rgba(108, 92, 231, 0.9)";
  ctx.fillText("WinIslands.JudeKwong.com", 960, 540);
  ctx.restore();
}
// ===== Main render =====
function renderAt(elapsed) {
  ctx.fillStyle = "#06060a";
  ctx.fillRect(0, 0, 1920, 1080);
  var grad = ctx.createRadialGradient(960, 300, 0, 960, 300, 900);
  grad.addColorStop(0, "rgba(108, 92, 231, 0.06)");
  grad.addColorStop(1, "rgba(0, 0, 0, 0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1920, 1080);

  var t = elapsed;

  // Island fade in/out alpha
  var islandAlpha = 1;
  if (t > 2500 && t < 3500) {
    islandAlpha = easeOutCubic((t - 2500) / 1000);
  } else if (t > 32000 && t < 32500) {
    islandAlpha = 1 - easeOutCubic((t - 32000) / 500);
  } else if (t >= 32500) {
    islandAlpha = 0;
  }

  if (t < 2500) {
    drawTitleScreen(t / 2500);
  } else if (t < 11500) {
    var sp = getSongPos(t);
    drawIsland(0, sp, t, true, islandAlpha);
  } else if (t < 15500) {
    // Spring expand (silky, non-linear)
    var et = (t - 11500) / 1000;
    var ep = silkySpring(et);
    drawIsland(ep, 9, t, true, islandAlpha);
  } else if (t < 24500) {
    var sp = getSongPos(t);
    drawIsland(1, sp, t, true, islandAlpha);
  } else if (t < 27500) {
    // Spring collapse (silky, non-linear)
    var ct = (t - 24500) / 1000;
    var ep = 1 - silkySpring(ct);
    drawIsland(ep, 18, t, false, islandAlpha);
  } else if (t < 32500) {
    // Compact island + more lyrics (no notifications)
    var sp = getSongPos(t);
    drawIsland(0, sp, t, false, islandAlpha);
  } else {
    drawCTA((t - 32500) / 2500);
  }
}

// ===== Setup =====
window.__promoReady = false;
coverImg.onload = function() { window.__promoReady = true; };
if (coverImg.complete) window.__promoReady = true;

var startTime = null;
function previewLoop(now) {
  if (startTime === null) startTime = now;
  var elapsed = now - startTime;
  if (elapsed < 35000) {
    renderAt(elapsed);
    requestAnimationFrame(previewLoop);
  } else {
    startTime = now;
    requestAnimationFrame(previewLoop);
  }
}
if (!window.__captureMode) {
  requestAnimationFrame(previewLoop);
}
</script>
